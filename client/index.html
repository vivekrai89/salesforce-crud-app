<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Salesforce Records</title>
  <style>
    :root { --ink:#16232e; --muted:#5b6b78; --line:#d5dde4; --bg:#eef2f5; --card:#fff; --accent:#0a6c74; --danger:#b3261e; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
    button,input,select,textarea { font:inherit; }
    .bar { display:flex; gap:12px; align-items:center; padding:14px 24px; background:var(--card); border-bottom:1px solid var(--line); }
    .bar h1 { font-size:18px; margin:0 auto 0 0; }
    .wrap { max-width:1200px; margin:0 auto; padding:20px 24px; }
    .tools { display:flex; gap:12px; align-items:center; margin-bottom:12px; }
    select,input,textarea { padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; width:100%; }
    .tools select { width:auto; min-width:200px; }
    button { padding:8px 14px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
    button:hover { border-color:var(--accent); }
    button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .danger { color:var(--danger); }
    .scroll { max-height:calc(100vh - 210px); overflow:auto; background:var(--card); border:1px solid var(--line); border-radius:8px; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; max-width:260px; overflow:hidden; text-overflow:ellipsis; }
    th { position:sticky; top:0; background:#f7f9fb; z-index:1; font-weight:600; }
    td.act { display:flex; gap:6px; }
    td.act button { padding:4px 10px; }
    .note { padding:14px; text-align:center; color:var(--muted); }
    .err { margin:0 0 12px; padding:10px 12px; border-radius:6px; background:#fdecea; color:var(--danger); }
    .center { min-height:100vh; display:grid; place-content:center; text-align:center; gap:16px; }
    .modal { position:fixed; inset:0; z-index:10; background:rgba(22,35,46,.5); display:grid; place-items:center; padding:16px; }
    .dlg { background:var(--card); border-radius:10px; width:min(560px,100%); max-height:90vh; overflow:auto; padding:20px; }
    .dlg h2 { margin:0 0 14px; font-size:18px; }
    label { display:block; margin-bottom:12px; font-weight:600; font-size:13px; color:var(--muted); }
    label input,label select,label textarea { margin-top:4px; font-weight:400; color:var(--ink); }
    .row { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
